<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Excluir Tarefa</title>
</head>
<body>
  <h1>Excluir Tarefa</h1>
  <p>Tem certeza que deseja excluir "<strong>{{ tarefa.titulo }}</strong>"?</p>
  <form method="POST">
    {% csrf_token %}
    <button type="submit">Confirmar exclusão</button>
  </form>
  <a href="{% url 'listar' %}">Cancelar</a>
</body>
</html>
