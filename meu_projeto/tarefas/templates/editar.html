<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Editar Tarefa</title>
</head>
<body>
  <h1>Editar Tarefa</h1>
  <form method="POST">
    {% csrf_token %}
    <input type="text" name="titulo" value="{{ tarefa.titulo }}" required>
    <label>
      <input type="checkbox" name="concluida" {% if tarefa.concluida %}checked{% endif %}>
      Concluída
    </label>
    <button type="submit">Atualizar</button>
  </form>
  <a href="{% url 'listar' %}">Cancelar</a>
</body>
</html>
